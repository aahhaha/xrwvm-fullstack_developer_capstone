services:
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      backend_url: http://database:3030
      sentiment_analyzer_url: http://sentiment:5050
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on: [database, sentiment]
  database:
    build: ./database
    environment:
      MONGO_URL: mongodb://mongo_db:27017/
    ports: ["3030:3030"]
    depends_on: [mongo_db]
  mongo_db:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
  sentiment:
    build: ./djangoapp/microservices
    ports: ["5050:5050"]
volumes:
  mongo_data:
